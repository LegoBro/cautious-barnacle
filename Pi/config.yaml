gpio:
  on_pin: 17
  off_pin: 27

recording:
  device: "0"
  width: 100
  height: 50
  fps: 3
  bitrate: "6000k"
  segment_seconds: 30 # max length for recording
  output_dir: "./recordings"

web:
  host: "0.0.0.0"
  port: 8080

storage:
  min_free_gb: 2
  max_days: 30

nas:
  enabled: false
  mount: ""
  remote_path: ""
  retry_seconds: 180

logging:
  dir: "./logs"
  level: "INFO"